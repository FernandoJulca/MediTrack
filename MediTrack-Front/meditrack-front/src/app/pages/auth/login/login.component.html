<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <!-- Card login -->
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <!-- Logo y título -->
            <div class="text-center mb-4">
              <div class="login-icon mb-3">
                <i class="bi bi-hospital fs-1 text-primary"></i>
              </div>
              <h4 class="fw-bold text-dark">MediTrack</h4>
              <p class="text-muted small">Sistema de Gestión Clínica</p>
            </div>

            <!-- Alerta de error -->
            <div *ngIf="error" class="alert alert-danger alert-dismissible rounded-3 py-2 small" role="alert">
              <i class="bi bi-exclamation-circle me-1"></i>{{ error }}
              <button type="button" class="btn-close btn-sm" (click)="error = ''"></button>
            </div>

            <!-- Formulario -->
            <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">

              <!-- Correo -->
              <div class="mb-3">
                <label class="form-label fw-semibold small">Correo electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-envelope text-muted"></i>
                  </span>
                  <input
                    type="email"
                    class="form-control border-start-0 ps-0"
                    [class.is-invalid]="correo?.invalid && correo?.touched"
                    formControlName="correo"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email">
                  <div class="invalid-feedback">
                    <span *ngIf="correo?.errors?.['required']">El correo es requerido.</span>
                    <span *ngIf="correo?.errors?.['email']">Ingresa un correo válido.</span>
                  </div>
                </div>
              </div>

              <!-- Contraseña -->
              <div class="mb-4">
                <label class="form-label fw-semibold small">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-lock text-muted"></i>
                  </span>
                  <input
                    [type]="mostrarContrasena ? 'text' : 'password'"
                    class="form-control border-start-0 border-end-0 ps-0"
                    [class.is-invalid]="contrasena?.invalid && contrasena?.touched"
                    formControlName="contrasena"
                    placeholder="••••••••"
                    autocomplete="current-password">
                  <button
                    type="button"
                    class="input-group-text bg-light border-start-0"
                    (click)="mostrarContrasena = !mostrarContrasena">
                    <i class="bi text-muted"
                      [class.bi-eye]="!mostrarContrasena"
                      [class.bi-eye-slash]="mostrarContrasena"></i>
                  </button>
                  <div class="invalid-feedback">
                    <span *ngIf="contrasena?.errors?.['required']">La contraseña es requerida.</span>
                    <span *ngIf="contrasena?.errors?.['minlength']">Mínimo 6 caracteres.</span>
                  </div>
                </div>
              </div>

              <!-- Botón -->
              <button
                type="submit"
                class="btn btn-primary w-100 py-2 fw-semibold rounded-3"
                [disabled]="cargando">
                <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
                <i *ngIf="!cargando" class="bi bi-box-arrow-in-right me-2"></i>
                {{ cargando ? 'Iniciando sesión...' : 'Iniciar sesión' }}
              </button>

            </form>

            

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
